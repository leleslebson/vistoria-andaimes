<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <title>Gerador de Cronograma Gantt</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/docsearch/jsdoc@3.13.0/build/jsdoc.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f8f9fa;
            color: #333;
        }
        .header {
            background-color: #2c3e50;
            color: white;
            padding: 1em;
            text-align: center;
        }
        .upload-section {
            margin: 2em auto;
            max-width: 800px;
            padding: 1em;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .buttons {
            display: flex;
            gap: 1em;
            margin-bottom: 2em;
        }
        .time-scales {
            display: flex;
            gap: 1em;
        }
        #chart-container {
            width: 100%;
            height: 80vh;
            background: #fff;
            border-radius: 8px;
            padding: 1em;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }
        .footer {
            text-align: center;
            margin-top: 2em;
            font-size: 0.9em;
            color: #888;
        }
        .dark-theme {
            background-color: #1e3a5f;
            color: white;
        }
        .theme-toggle {
            margin-left: auto;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="header">
    <h1>Gerador de Cronograma Gantt</h1>
    <p><i>Importe um arquivo Excel e visualize seu planejamento</i></p>
</div>

<div class="upload-section">
    <input type="file" id="fileInput" accept=".xlsx, .xls" />
    <div id="statusMessage"></div>
    <button class="btn btn-primary" onclick="loadFile()">Selecionar Arquivo Excel</button>
</div>

<div class="buttons">
    <button class="btn btn-outline-secondary" onclick="setTimeScale('daily')">Diário</button>
    <button class="btn btn-outline-secondary" onclick="setTimeScale('weekly')">Semanal</button>
    <button class="btn btn-outline-secondary" onclick="setTimeScale('monthly')">Mensal</button>
    <button class="btn btn-outline-secondary" onclick="setTimeScale('annual')">Anual</button>
    <button class="btn btn-outline-secondary" onclick="toggleTheme()">Trocar Tema</button>
</div>

<div id="chart-container"></div>

<script src="https://unpkg.com/xlsx@0.18.4/dist/xlsx.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/frappe-gantt@latest/dist/frappe-gantt.min.js"></script>
<script>
    const chartContainer = document.getElementById('chart-container');
    const fileInput = document.getElementById('fileInput');
    const statusMessage = document.getElementById('statusMessage');

    function loadFile() {
        fileInput.click();
    }

    fileInput.addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;
        
        const reader = new FileReader();
        reader.onload = function(event) {
            try {
                const data = event.target.result;
                const workbook = XLSX.read(data, { type: 'binary' });
                
                // Validate file
                if (workbook.Sheets && Object.keys(workbook.Sheets).length === 0) {
                    statusMessage.innerText = "Arquivo inválido. Por favor, selecione um arquivo com planilhas.";
                    return;
                }
                
                const sheets = workbook.Sheets;
                let currentSheet = sheets[Object.keys(sheets)[0]];
                let columns = [];
                
                // Determine columns
                if (currentSheet && currentSheet['$t'] === 'worksheet') {
                    const titleRow = currentSheet['!ref'];
                    const rows = XLSX.utils.sheet_to_json(currentSheet, { header: "row" });
                    
                    if (!rows || !rows.length) {
                        statusMessage.innerText = "Arquivo vazio. Favor carregar um arquivo com dados.";
                        return;
                    }
                    
                    // Detect required columns
                    const requiredColumns = ['Tarefa', 'Início', 'Fim', 'Progresso', 'Responsável'];
                    let mappedColumns = {};
                    let customColumns = [];

                    for (let i = 0; i < rows.length; i++) {
                        const row = rows[i];
                        if (!row) continue;

                        // Map columns
                        for (const col of requiredColumns) {
                            if (row[col]) {
                                mappedColumns[col] = row[col];
                            } else {
                                customColumns.push(col);
                            }
                        }
                    }

                    // Show custom mapping
                    statusMessage.innerText = "Mapeamento de colunas:";
                    const mappingDiv = document.createElement('div');
                    mappingDiv.style.marginTop: '1em';
                    mappingDiv.innerHTML = `
                        <pre>${customColumns.join(', ')}</pre>
                    `;
                    chartContainer.appendChild(mappingDiv);

                    // Parse data
                    let tasks = [];
                    for (let i = 0; i < rows.length; i++) {
                        const row = rows[i];
                        if (!row) continue;

                        const task = {};
                        for (const [col, value] of Object.entries(mappedColumns)) {
                            task[col] = value;
                        }
                        
                        // Add custom columns
                        for (const col of customColumns) {
                            if (row[col]) task[col] = row[col];
                        }

                        tasks.push(task);
                    }

                    // Generate chart
                    generateGanttChart(tasks, 'daily');
                } else {
                    statusMessage.innerText = "Arquivo inválido. Favor carregar um arquivo Excel.";
                }
            } catch (err) {
                console.error('Erro ao processar o arquivo:', err);
                statusMessage.innerText = "Erro ao ler o arquivo. Por favor, tente novamente.";
            }
        };
        reader.readAsBinaryString(file);
    });

    function setTimeScale(scale) {
        const chart = frappeGantt.getChart();
        if (!chart) return;
        
        // Set scale
        chart.setOptions({
            timeScale: scale === 'daily' ? 1 : 
                      scale === 'weekly' ? 7 : 
                      scale === 'monthly' ? 30 : 
                      scale === 'annual' ? 365 : 1,
            showTimeAxis: true,
            showProgress: true
        });
    }

    function toggleTheme() {
        document.body.classList.toggle('dark-theme');
    }

    function generateGanttChart(tasks, scale) {
        const chart = new frappeGantt({
            container: chartContainer,
            data: tasks,
            options: {
                height: '100%',
                timeScale: scale === 'daily' ? 1 : 
                         scale === 'weekly' ? 7 : 
                         scale === 'monthly' ? 30 : 
                         scale === 'annual' ? 365 : 1,
                showTimeAxis: true,
                showProgress: true,
                showTaskDetails: true,
                taskDraggable: true,
                taskResizable: true,
                taskSelectMode: 'single',
                axisFormat: (axis, value) => {
                    if (axis === 'time') {
                        return new Date(value).toLocaleDateString();
                    }
                    return value;
                },
                taskStyle: {
                    duration: 100,
                    progress: 50,
                    status: {
                        notStarted: '#f39c12',
                        inProgress: '#27ae60',
                        completed: '#2ecc71',
                        overdue: '#e74c3c'
                    }
                },
                tooltip: {
                    show: true,
                    position: 'right'
                }
            }
        });

        // Add current date line
        const currentDate = new Date();
        chart.addLine({
            type: 'line',
            data: [{
                x: currentDate.getTime(),
                y: 0,
                color: '#e74c3c'
            }]
        });
    }

    function exportHTML() {
        const htmlContent = `
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <title>Cronograma Gantt</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .chart-container {
            width: 100%;
            height: 100vh;
            position: relative;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <h1>Gerador de Cronograma Gantt</h1>
        <div id="chart-container"></div>
    </div>
    <script src="https://unpkg.com/xlsx@0.18.4/dist/xlsx.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/frappe-gantt@latest/dist/frappe-gantt.min.js"></script>
</body>
</html>
        `;
        
        const blob = new Blob([htmlContent], { type: 'text/html' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'Cronograma_Gantt.html';
        a.click();
    }
</script>

</body>
</html>
